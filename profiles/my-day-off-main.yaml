name: my-day-off-main
components:
  - id: main
    label: "휴일 판정 결과"  
    capabilities:
      - id: achievedictionary39087.myDayOffStatus
        version: 1
      - id: achievedictionary39087.myDayOffDetails
        version: 1
      - id: refresh
        version: 1
      - id: healthCheck
        version: 1
    categories:
      - name: WiFiRouter

  - id: toggle
    label: "휴일/평일 강제전환"
    capabilities:
      - id: momentary
        version: 1
    categories:
      - name: WiFiRouter

  - id: status
    label: "기기 상태"
    capabilities:
      # ── [DEBUG] 날짜 오버라이드 UI 숨김처리 ─────────────────────────────
      # 복원 시 아래 두 줄 주석 해제 + 각 파일의 동일 표시 주석도 함께 해제할 것:
      #   src/holiday_checker.lua  │ "debug_date_cap" 선언 줄
      #                            │ "디버그 캡 emit" 블록 (status_comp/debug_date_cap)
      #   src/init.lua             │ handle_refresh() 내 emit 블록
      #                            │ handle_debug_set_date() 내 emit 블록
      # ─────────────────────────────────────────────────────────────────────
      # - id: achievedictionary39087.debugDate
      #   version: 1
      - id: achievedictionary39087.debugMessage
        version: 1
    categories:
      - name: WiFiRouter

preferences:
  - name: proxyUrl
    title: Edge Bridge URL
    description: "예: http://192.168.0.60:8088 (포트까지만)"
    required: true
    preferenceType: string
    definition:
      stringType: text
      default: "http://192.168.0.60:8088"

  - name: startWebServer
    title: "설정 웹서버 실행 (30분)"
    description: "설정 웹서버를 엽니다 (30분 뒤 자동 종료). 진행 상태나 잔여시간이 웹UI 상단에 나타납니다."
    required: false
    preferenceType: boolean
    definition:
      default: false


  - name: dateOffset
    title: "날짜 오프셋"
    description: "0=오늘, 1=내일, 2=모레 판정 (0~7)"
    required: false
    preferenceType: integer
    definition:
      minimum: 0
      maximum: 7
      default: 0


  - name: addSameDevice
    title: "장치 추가"
    description: "토글을 켜면 디바이스가 추가됩니다. 새 디바이스는 이 디바이스와 완전히 독립적으로 동작합니다."
    required: false
    preferenceType: boolean
    definition:
      default: false
